<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpanishLingo Studios - Where Punjabi beats meet Spanish rhythm. A global music fusion studio bringing cultures, sounds, and emotions together." />
    <meta name="keywords" content="Spanish, Punjabi, Music, Fusion, Studios, Latin, Collaboration" />
    <title>SpanishLingo Studios - Music Fusion</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    
    <!-- Preconnect to speed up external connections -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical above-the-fold assets -->
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <link rel="preload" href="/menu.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    
    <!-- Preload Hero Section Images (Critical - Above the fold) -->
    <link rel="preload" href="/hero/artist1_new.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/hero/artist2.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/hero/artist3.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/hero/artist4.png" as="image" type="image/png" fetchpriority="high" />
    
    <!-- Below-the-fold sections are lazy-loaded and handle their own image preloading -->
    <!-- This prevents "preloaded but not used" warnings and improves initial page load -->
    <style>
      .container-show {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 1440px !important;
        width: 100%;
        margin: 0 auto;
        border-left: 1px solid red;
        border-right: 1px solid red;
        z-index: 1000;
        height: 100vh;
      }
      .container-content {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 1240px !important;
        width: 100%;
        margin: 0 auto;
        border-left: 1px solid white;
        border-right: 1px solid white;
        z-index: 1000;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <!-- <div class="container-show"></div>
    <div class="container-content"></div> -->
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
