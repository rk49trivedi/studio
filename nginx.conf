# Nginx Configuration for SpanishLingo Studios
# Place this in: /www/server/panel/vhost/nginx/spanishlingo-studios.com.conf
# Or configure via aapanel: Website -> Settings -> Configuration Files -> Nginx Config

# Upstream for Node.js application
upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Cache zone for static assets (SVGs, images, fonts, etc.)
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name spanishlingo-studios.com www.spanishlingo-studios.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spanishlingo-studios.com www.spanishlingo-studios.com;
    
    # SSL Configuration (aapanel will auto-configure this)
    # ssl_certificate /www/server/panel/vhost/cert/spanishlingo-studios.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/spanishlingo-studios.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Root directory (where your built files are)
    root /www/wwwroot/spanishlingo-studios.com/dist/spa;
    index index.html;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";
    
    # Brotli Compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;
    
    # Cache Control Headers for Static Assets
    # SVGs - Aggressive caching (1 year) since they're large and don't change often
    location ~* \.(svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        # Enable caching
        proxy_cache static_cache;
        proxy_cache_valid 200 1y;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        # Try to serve from cache or filesystem first
        try_files $uri @nodejs;
    }
    
    # Images (PNG, JPG, JPEG, WebP, GIF) - 1 year cache
    location ~* \.(png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        proxy_cache static_cache;
        proxy_cache_valid 200 1y;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        try_files $uri @nodejs;
    }
    
    # Fonts - 1 year cache
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        proxy_cache static_cache;
        proxy_cache_valid 200 1y;
        
        try_files $uri @nodejs;
    }
    
    # JavaScript and CSS - 1 year cache (with versioning/hashing)
    location ~* \.(js|css|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        proxy_cache static_cache;
        proxy_cache_valid 200 1y;
        
        try_files $uri @nodejs;
    }
    
    # Audio files (MP3, etc.) - 1 year cache
    location ~* \.(mp3|m4a|ogg|wav|flac|aac)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        proxy_cache static_cache;
        proxy_cache_valid 200 1y;
        
        try_files $uri @nodejs;
    }
    
    # JSON and other static files
    location ~* \.(json|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @nodejs;
    }
    
    # API Routes - Proxy to Node.js backend
    location /api/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # No caching for API
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://nodejs_backend;
        access_log off;
    }
    
    # Serve static files directly from filesystem (faster)
    location / {
        # Try to serve static files first, then fallback to Node.js for SPA routing
        try_files $uri $uri/ @nodejs;
        
        # Cache HTML files for a short time (5 minutes)
        location ~* \.(html)$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300";
            add_header Vary "Accept-Encoding";
            try_files $uri @nodejs;
        }
    }
    
    # Fallback to Node.js for SPA routing
    location @nodejs {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Logging
    access_log /www/wwwlogs/spanishlingo-studios.com.log;
    error_log /www/wwwlogs/spanishlingo-studios.com.error.log;
}
